name: Build ImmortalWrt BE7000

on:
  workflow_dispatch: # 允许手动点击按钮触发编译
  push:
    tags:
      - 'v*' # 打 v 开头的标签时自动编译并发布 Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 超时时间 6 小时
    permissions:
      contents: write # 发布 Release 必须的写权限

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # 清理 GitHub Runner 自带的无用大型工具，腾出更多空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time

      - name: Verify .config exists
        run: |
          if [ ! -f ".config" ]; then
            echo "ERROR: .config not found in repository root. Aborting."
            exit 1
          fi
          echo ".config found."

      # 缓存 1：dl 源码包（限制在 4G 内的还原，通常源码包在 2G 左右）
      - name: Restore dl cache
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ github.sha }}
          restore-keys: |
            dl-

      # 缓存 2：ccache 编译缓存（使用专用 Action，限制 2.5G，配合 10G 总容量绝对安全）
      - name: Restore ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-
          max-size: 2.5G  # 硬限制 ccache 体积

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare build config
        run: |
          # 注入编译优化和缓存选项
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          echo "CONFIG_CCACHE_SIZE=2G" >> .config  # 在配置里也声明 2G，双保险
          make defconfig

      - name: Download sources
        run: make download -j4

      - name: Compile firmware
        run: |
          # 先以 4 线程编译（节省内存防 OOM），如果失败则单线程 V=s 打印详细日志
          make -j4 || make -j1 V=s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-BE7000
          path: |
            bin/targets/*/*/*.bin
            bin/targets/*/*/*.ubi
            bin/targets/*/*/*.img
            bin/targets/*/*/*.tar.gz
            bin/targets/*/*/*.itb
            bin/targets/*/*/*config.buildinfo
          if-no-files-found: error

      # 新增：自动发布到 Release 页面，仅推送 v* 标签时触发
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            bin/targets/*/*/*.bin
            bin/targets/*/*/*.ubi
            bin/targets/*/*/*.img
            bin/targets/*/*/*.tar.gz
            bin/targets/*/*/*.itb
            bin/targets/*/*/*config.buildinfo
          generate_release_notes: true
          draft: false
          prerelease: false

# --- 新增：发布软件包到 gh-pages 分支 ---
      - name: Deploy Packages to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 这里的路径请根据你的固件输出目录调整，通常 .apk 文件在这个目录下
          publish_dir: ./bin/targets/qualcommbe/ipq95xx/packages 
          publish_branch: gh-pages
          # 把它放到以架构命名的子目录中，方便区分
          destination_dir: aarch64_cortex-a53
          # 不保留旧文件，每次纯覆盖
          keep_files: false
