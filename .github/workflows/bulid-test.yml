name: Build ImmortalWrt BE7000 test

on:
  workflow_dispatch: # 仅允许手动点击按钮触发编译
    inputs:
      config_file:
        description: '请输入根目录下的配置文件名称 (例如 .config 或 my.config)'
        required: true
        default: '.config'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 超时时间 6 小时

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # 清理 GitHub Runner 自带的无用大型工具，腾出更多空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time

      - name: Verify and Prepare config file
        run: |
          # 读取用户输入的配置文件名
          CONFIG_FILE="${{ github.event.inputs.config_file }}"
          
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "ERROR: 配置文件 '$CONFIG_FILE' 未在仓库根目录找到，终止编译。"
            exit 1
          fi
          echo "成功找到配置文件: $CONFIG_FILE"
          
          # 如果输入的配置文件不是默认的 .config，则将其复制并重命名为 .config 供编译系统使用
          if [ "$CONFIG_FILE" != ".config" ]; then
            echo "正在将 $CONFIG_FILE 应用为编译配置 .config..."
            cp "$CONFIG_FILE" .config
          fi

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare build config
        run: |
          # 注入编译优化选项
          echo "CONFIG_DEVEL=y" >> .config
          
          # 强制跳过预置依赖检查，防止 GitHub 环境导致 Prerequisite check failed
          export FORCE=1
          
          make defconfig

      - name: Download sources
        run: make download -j4

      - name: Compile firmware
        run: |
          # 先以 4 线程编译，如果失败则单线程 V=s 打印详细日志
          make -j4 || make -j1 V=s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          # 动态命名上传的压缩包，方便区分使用的是哪个配置
          name: ImmortalWrt-BE7000-${{ github.event.inputs.config_file }}
          path: |
            bin/targets/*/*/*.bin
            bin/targets/*/*/*.ubi
            bin/targets/*/*/*.img
            bin/targets/*/*/*.tar.gz
            bin/targets/*/*/*.itb
            bin/targets/*/*/*config.buildinfo
          if-no-files-found: error

# --- 新增：发布软件包到 gh-pages-test 分支 ---
      - name: Deploy Test Packages to gh-pages-test
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./bin/targets/qualcommbe/ipq95xx/packages 
          publish_branch: gh-pages-test
          destination_dir: aarch64_cortex-a53
          keep_files: false
