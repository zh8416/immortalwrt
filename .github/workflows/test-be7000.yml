name: Build ImmortalWrt (自定义机型)

on:
  workflow_dispatch: # 仅允许手动点击按钮触发编译
    inputs:
      config_file:
        description: '请输入根目录下的配置文件名称 (例如 .config 或 my.config)'
        required: true
        default: '7000.config'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 超时时间 6 小时

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # 清理 GitHub Runner 自带的无用大型工具，腾出更多空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time

      - name: Verify and Prepare config file
        run: |
          # 读取用户输入的配置文件名
          CONFIG_FILE="${{ github.event.inputs.config_file }}"
          
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "ERROR: 配置文件 '$CONFIG_FILE' 未在仓库根目录找到，终止编译。"
            exit 1
          fi
          echo "成功找到配置文件: $CONFIG_FILE"
          
          # 如果输入的配置文件不是默认的 .config，则将其复制并重命名为 .config 供编译系统使用
          if [ "$CONFIG_FILE" != ".config" ]; then
            echo "正在将 $CONFIG_FILE 应用为编译配置 .config..."
            cp "$CONFIG_FILE" .config
          fi

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare build config
        run: |
          # 注入编译优化选项
          echo "CONFIG_DEVEL=y" >> .config
          
          # 强制跳过预置依赖检查，防止 GitHub 环境导致 Prerequisite check failed
          export FORCE=1
          
          make defconfig

      - name: Download sources
        run: make download -j4

      - name: Compile firmware
        run: |
          # 先以 4 线程编译，如果失败则单线程 V=s 打印详细日志
          make -j4 || make -j1 V=s

      # ================= 替换为 V7 独立上传模式 =================

      - name: Upload .bin files
        uses: actions/upload-artifact@v7
        with:
          # 匹配到单个文件时直接显示文件名，如果匹配到多个（如 factory 和 sysupgrade）会直接报错
          # 但通常 OpenWrt 一个设备编译出来的同后缀文件一般只有一个，可以用通配符
          path: bin/targets/*/*/*.bin
          archive: false
          if-no-files-found: ignore

      - name: Upload .ubi files
        uses: actions/upload-artifact@v7
        with:
          path: bin/targets/*/*/*.ubi
          archive: false
          if-no-files-found: ignore

      - name: Upload .img files
        uses: actions/upload-artifact@v7
        with:
          path: bin/targets/*/*/*.img
          archive: false
          if-no-files-found: ignore

      - name: Upload .tar.gz files
        uses: actions/upload-artifact@v7
        with:
          path: bin/targets/*/*/*.tar.gz
          archive: false
          if-no-files-found: ignore

      - name: Upload .itb files
        uses: actions/upload-artifact@v7
        with:
          path: bin/targets/*/*/*.itb
          archive: false
          if-no-files-found: ignore

      - name: Upload build config info
        uses: actions/upload-artifact@v7
        with:
          path: bin/targets/*/*/*config.buildinfo
          archive: false
          if-no-files-found: ignore

