name: Build ImmortalWrt (new)

# 手动触发；机型用 boolean 勾选（可多选），config_file 保持文本框
on:
  workflow_dispatch:
    inputs:
      config_file:
        description: '配置文件（仓库根目录文件名，如 all.config / min.config；省略 .config 后缀也可）'
        required: true
        default: 'all.config'
        type: string
      be7000:
        description: '编译小米 BE7000'
        required: false
        default: false
        type: boolean
      be10000:
        description: '编译小米 BE10000'
        required: false
        default: false
        type: boolean
      ax1800:
        description: '编译小米 AX1800（ipq60xx，与 BE 组合时自动分 job）'
        required: false
        default: false
        type: boolean
      ax3600:
        description: '编译小米 AX3600（ipq807x 大分区版，自动分 job）'
        required: false
        default: false
        type: boolean
      all_devices:
        description: '全选（勾选后忽略上面四个机型开关）'
        required: false
        default: false
        type: boolean
      extra_packages:
        description: '额外软件包（可选，空格分隔，自动补齐依赖）'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: build-all-new-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_NOTES: .github/build-notes.md

jobs:
  # ---------- 1. 解析机型勾选，按 target 分组输出 matrix ----------
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.group.outputs.matrix }}
      devices_label: ${{ steps.group.outputs.label }}
      config_file: ${{ steps.cfg.outputs.config_file }}
      config_mode: ${{ steps.cfg.outputs.config_mode }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify config file
        id: cfg
        env:
          CONFIG_FILE_INPUT: ${{ github.event.inputs.config_file }}
        run: |
          RAW="${CONFIG_FILE_INPUT:-all.config}"
          RAW="${RAW#./}"
          case "$RAW" in
            ""|/*|*..*) echo "::error::非法配置文件名：$RAW"; exit 1 ;;
          esac
          CONFIG_FILE="$RAW"
          if [ ! -f "$CONFIG_FILE" ] && [ -f "${CONFIG_FILE}.config" ]; then CONFIG_FILE="${CONFIG_FILE}.config"; fi
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error::配置文件 $RAW 未找到"; ls -1 *.config 2>/dev/null || true; exit 1
          fi
          grep -qx 'CONFIG_TARGET_MULTI_PROFILE=y' "$CONFIG_FILE" && MODE=multi || MODE=single
          echo "config_file=$CONFIG_FILE mode=$MODE"
          echo "config_file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"
          echo "config_mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Group devices by target
        id: group
        env:
          BE7000: ${{ github.event.inputs.be7000 }}
          BE10000: ${{ github.event.inputs.be10000 }}
          AX1800: ${{ github.event.inputs.ax1800 }}
          AX3600: ${{ github.event.inputs.ax3600 }}
          ALL_DEV: ${{ github.event.inputs.all_devices }}
        run: |
          python3 - <<'PYEOF' > matrix.json
          import json, os
          # 机型 -> (分组key, board, subtarget, 显示名)
          DEVICES = {
              "BE7000":  ("be",     "qualcommbe", "ipq95xx", "BE7000"),
              "BE10000": ("be",     "qualcommbe", "ipq95xx", "BE10000"),
              "AX1800":  ("ax",     "qualcommax", "ipq60xx", "AX1800"),
              "AX3600":  ("ax3600", "qualcommax", "ipq807x", "AX3600"),
          }
          all_ = os.getenv("ALL_DEV") == "true"
          picked = [name for name in DEVICES if all_ or os.getenv(name) == "true"]
          if not picked:
              raise SystemExit("ERROR: 未勾选任何机型")
          groups = {}
          for name in picked:
              key, board, subtarget, label = DEVICES[name]
              groups.setdefault(key, {"board": board, "subtarget": subtarget, "devs": [], "labels": []})
              groups[key]["devs"].append("xiaomi_" + name.lower())
              groups[key]["labels"].append(label)
          inc = []
          for key, g in groups.items():
              inc.append({
                  "target": key,
                  "board": g["board"],
                  "subtarget": g["subtarget"],
                  "devices": " ".join(g["devs"]),
                  "label": "+".join(g["labels"]),
              })
          print(json.dumps({"include": inc}, ensure_ascii=False))
          PYEOF
          MATRIX=$(cat matrix.json)
          echo "matrix=$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          LABEL=$(python3 -c 'import json,sys; m=json.load(open("matrix.json")); print(" + ".join(x["label"] for x in m["include"]))')
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

  # ---------- 2. 按 target 并行编译 ----------
  build:
    needs: resolve
    if: ${{ needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
    steps:
      - name: Record start time
        id: start_time
        run: echo "start_ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Cache source downloads (dl/)
        uses: actions/cache@v4
        with:
          path: dl
          key: openwrt-dl-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            openwrt-dl-${{ github.ref_name }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: openwrt-ccache-${{ matrix.target }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            openwrt-ccache-${{ matrix.target }}-${{ github.ref_name }}-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time

      - name: Prepare config for target
        env:
          CONFIG_FILE: ${{ needs.resolve.outputs.config_file }}
          TARGET: ${{ matrix.target }}
          DEVICES: ${{ matrix.devices }}
        run: |
          set -euo pipefail
          echo "配置源: $CONFIG_FILE | target: $TARGET | 机型: $DEVICES"
          cp "$CONFIG_FILE" .config

          if [ "$TARGET" = "ax" ] || [ "$TARGET" = "ax3600" ]; then
            # AX 平台：把 config 的 TARGET_* 段替换为对应模板，保留公共包清单
            case "$TARGET" in
              ax)     TPL=".github/targets/ax1800.target" ;;
              ax3600) TPL=".github/targets/ax3600.target" ;;
            esac
            [ -f "$TPL" ] || { echo "::error::缺少 $TPL"; exit 1; }
            python3 - "$TPL" <<'PYEOF'
          import re, sys
          tpl = sys.argv[1]
          ax = {}
          for l in open(tpl, encoding='utf-8', errors='replace'):
              s = l.rstrip('\n')
              m = re.match(r'^(# )?CONFIG_TARGET_([A-Za-z0-9_.-]+)(.*)$', s)
              if m:
                  ax[m.group(2)] = s
          out = []
          for l in open('.config', encoding='utf-8', errors='replace'):
              s = l.rstrip('\n')
              m = re.match(r'^(# )?CONFIG_TARGET_([A-Za-z0-9_.-]+)(.*)$', s)
              if m:
                  continue
              out.append(s)
          for k, v in ax.items():
              out.append(v)
          open('.config', 'w', encoding='utf-8', newline='\n').write('\n'.join(out) + '\n')
          print('AX target 段已注入（全量替换，%d 行）' % len(ax))
          PYEOF
            # 追加 AX 专属驱动（defconfig 会自动处理依赖）
            if [ "$TARGET" = "ax" ]; then
              for p in kmod-ath11k kmod-ath11k-ahb kmod-ath11k-pci \
                       ath11k-firmware-ipq6018-ddwrt ipq-wifi-xiaomi_ax1800 kmod-nss-wifi-drv; do
                grep -qx "CONFIG_PACKAGE_${p}=y" .config || echo "CONFIG_PACKAGE_${p}=y" >> .config
              done
            else
              # AX3600 = ipq8071 + ATH10K(qca9887) + ipq-wifi
              for p in kmod-ath10k-smallbuffers ath10k-firmware-qca9887 ipq-wifi-xiaomi_ax3600; do
                grep -qx "CONFIG_PACKAGE_${p}=y" .config || echo "CONFIG_PACKAGE_${p}=y" >> .config
              done
            fi
          else
            # BE：config 已是 qualcommbe，只保留勾中的机型（多机型按 DEVICE 行过滤）
            for dev in $DEVICES; do
              grep -qx "CONFIG_TARGET_DEVICE_qualcommbe_ipq95xx_DEVICE_${dev}=y" .config || \
                echo "CONFIG_TARGET_DEVICE_qualcommbe_ipq95xx_DEVICE_${dev}=y" >> .config
            done
            awk -v keep="$DEVICES" '
              /^CONFIG_TARGET_DEVICE_qualcommbe_ipq95xx_DEVICE_xiaomi_be(7000|10000)=y$/ {
                d=$0; sub(/^.*DEVICE_/,"",d); sub(/=y$/,"",d)
                if (index(" " keep " ", " " d " ") == 0) {
                  sub(/^CONFIG_TARGET_DEVICE_/, "# CONFIG_TARGET_DEVICE_"); sub(/=y$/, " is not set")
                }
              }
              { print }
            ' .config > .config.dev && mv .config.dev .config
            echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
            echo "CONFIG_TARGET_PER_DEVICE_ROOTFS=y" >> .config
          fi

          echo "--- 目标 target 段 ---"
          grep -E '^CONFIG_TARGET_(qualcommbe|qualcommax)(_ipq95xx|_ipq60xx|_ipq807x)?=y$|^CONFIG_TARGET_PROFILE=|^CONFIG_TARGET_DEVICE_.*DEVICE_xiaomi.*=y$' .config | grep -v 'is not set' | head -10

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare build config
        run: |
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          export FORCE=1
          make defconfig
          # 校验 target 与机型
          case "${{ matrix.target }}" in
            be) grep -qx 'CONFIG_TARGET_qualcommbe_ipq95xx=y' .config || { echo "::error::BE target 未生效"; exit 1; }
                for dev in ${{ matrix.devices }}; do
                  grep -qE "^CONFIG_TARGET_(DEVICE_)?qualcommbe_ipq95xx_DEVICE_${dev}=y" .config || { echo "::error::${dev} 未选中"; exit 1; }
                done ;;
            ax) grep -qx 'CONFIG_TARGET_qualcommax_ipq60xx=y' .config || { echo "::error::AX1800 target(ipq60xx) 未生效"; exit 1; }
                grep -qx 'CONFIG_TARGET_PROFILE="DEVICE_xiaomi_ax1800"' .config || { echo "::error::AX1800 profile 未生效"; exit 1; } ;;
            ax3600) grep -qx 'CONFIG_TARGET_qualcommax_ipq807x=y' .config || { echo "::error::AX3600 target(ipq807x) 未生效"; exit 1; }
                grep -qx 'CONFIG_TARGET_PROFILE="DEVICE_xiaomi_ax3600"' .config || { echo "::error::AX3600 profile 未生效"; exit 1; } ;;
          esac
          echo "target 与机型校验通过"
          echo "DEVS=${{ matrix.devices }}" >> "$GITHUB_ENV"

      - name: Apply extra packages
        env:
          EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages }}
        run: |
          set -euo pipefail
          if [ -z "${EXTRA_PACKAGES:-}" ]; then echo "未填写额外软件包，跳过。"; exit 0; fi
          if [ ! -s tmp/.packageinfo ] || [ ! -s tmp/.config-package.in ]; then make prepare-tmpinfo; fi
          [ -s tmp/.packageinfo ] || { echo "::error::包元数据生成失败"; exit 1; }
          echo "请求的额外软件包：$EXTRA_PACKAGES"
          python3 .github/scripts/resolve_pkg_deps.py .config $EXTRA_PACKAGES
          export FORCE=1
          make defconfig
          missing=0
          for pkg in $EXTRA_PACKAGES; do
            if grep -qx "CONFIG_PACKAGE_${pkg}=y" .config; then echo "  ✓ $pkg"; else echo "  ✗ $pkg 未生效"; missing=$((missing+1)); fi
          done
          if [ "$missing" -gt 0 ]; then echo "::warning::有 $missing 个额外软件包未生效"; fi
          exit 0

      - name: Download sources
        run: make download -j4

      - name: Compile firmware
        run: make -j4 || make -j1 V=s

      - name: Collect release assets
        id: collect
        run: |
          set -euo pipefail
          mkdir -p release-assets
          STAMP=$(TZ=Asia/Shanghai date +'%Y.%m.%d-%H.%M.%S')
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          T="bin/targets/${{ matrix.board }}/${{ matrix.subtarget }}"
          [ -d "$T" ] || { echo "::error::未找到输出目录 $T"; exit 1; }
          CB=$(find "$T" -maxdepth 1 -type f -name 'config.buildinfo' | head -n1)
          [ -n "$CB" ] || { echo "::error::缺少 config.buildinfo"; exit 1; }
          cp "$CB" "release-assets/config.buildinfo-${{ matrix.target }}-${STAMP}"
          pick() {
            local dev="$1" hint="$2" ext="$3" f
            f=$(find "$T" -maxdepth 1 -type f -name "*${dev}*${hint}*.${ext}" | head -n1)
            [ -z "$f" ] && f=$(find "$T" -maxdepth 1 -type f -name "*${dev}*.${ext}" | head -n1)
            [ -z "$f" ] && { echo "::error::缺少 ${dev} 的 .${ext}"; exit 1; }
            base=$(basename "$f")
            cp "$f" "release-assets/${base%.*}-${STAMP}.${base##*.}"
          }
          for dev in ${{ matrix.devices }}; do
            pick "$dev" "squashfs-sysupgrade" "bin"
            pick "$dev" "factory"   "ubi"
            pick "$dev" "initramfs-uImage" "itb"
          done
          echo "已收集 $(find release-assets -maxdepth 1 -type f | wc -l) 个产物："
          ls -lh release-assets

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: release-assets/*
          retention-days: 3

  # ---------- 3. 汇总产物，创建 Release，推送结果 ----------
  release:
    needs: [resolve, build]
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: start_time
        run: echo "start_ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download build outputs
        run: |
          mkdir -p release-assets
          for t in $(echo '${{ needs.resolve.outputs.matrix }}' | python3 -c 'import json,sys; print(" ".join(x["target"] for x in json.load(sys.stdin)["include"]))'); do
            echo "下载 build-$t"
          done

      - name: Collect all assets
        uses: actions/download-artifact@v4
        with:
          path: .
          merge-multiple: false

      - name: Flatten assets
        run: |
          set -euo pipefail
          find build-* -maxdepth 1 -type f -exec cp {} release-assets/ \; 2>/dev/null || true
          echo "汇总附件 $(find release-assets -maxdepth 1 -type f | wc -l) 个："
          ls -lh release-assets

      - name: Create GitHub Release
        id: release
        if: ${{ needs.build.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Shanghai date +%Y.%m.%d)
          PREFIX="v${DATE}."
          gh api --paginate -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/tags?per_page=100" --jq '.[].name' > tags.txt 2>/dev/null || : > tags.txt
          n=1
          while :; do
            TAG="${PREFIX}$(printf '%02d' "$n")"
            grep -qxF "$TAG" tags.txt && { n=$((n+1)); continue; }
            gh release view "$TAG" >/dev/null 2>&1 && { n=$((n+1)); continue; }
            break
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "### 固件：${{ needs.resolve.outputs.devices_label }}"
            echo ""
            echo "- 配置文件：\`${{ needs.resolve.outputs.config_file }}\`"
            echo "- 额外软件包：$(if [ -n '${{ github.event.inputs.extra_packages }}' ]; then printf '%s' '${{ github.event.inputs.extra_packages }}' | sed 's/  */、/g'; else echo 无; fi)"
            echo "- 源码：\`${GITHUB_REPOSITORY}\` @ \`${GITHUB_SHA}\`（分支 \`${GITHUB_REF_NAME}\`）"
            echo "- 编译时间（北京时间）：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
            echo "- 构建记录：[#${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ""
            echo "### 附件（$(ls release-assets | wc -l) 个）"
            echo "| 文件 | 大小 |"; echo "| --- | --- |"
            for f in release-assets/*; do echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"; done
          } > release_body.md
          gh release create "$TAG" release-assets/* --title "$TAG (${{ needs.resolve.outputs.devices_label }})" --notes-file release_body.md

      - name: PushPlus result notification
        if: always()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          START_TS: ${{ steps.start_time.outputs.start_ts }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DEV_LABEL: ${{ needs.resolve.outputs.devices_label }}
          CONFIG_FILE: ${{ needs.resolve.outputs.config_file }}
          INPUT_EXTRA_PACKS: ${{ github.event.inputs.extra_packages }}
        run: |
          set +e
          [ -z "${PUSHPLUS_TOKEN:-}" ] && { echo "::warning::PUSHPLUS_TOKEN 未配置，跳过"; exit 0; }
          case "${BUILD_RESULT:-}" in
            success) ST="成功"; COLOR="green" ;;
            failure) ST="失败"; COLOR="red" ;;
            cancelled) ST="已取消"; COLOR="#e67e22" ;;
            *) ST="${BUILD_RESULT:-未知}"; COLOR="#555" ;;
          esac
          START_TS="${START_TS:-}"
          if [ -n "$START_TS" ]; then
            D=$(( $(date +%s) - START_TS )); [ "$D" -lt 0 ] && D=0
            DUR=$(printf '%02d:%02d:%02d' $((D/3600)) $(((D%3600)/60)) $((D%60)))
          else DUR="未知"; fi
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          REL="${RELEASE_TAG:-未创建}"
          EXTRA="${INPUT_EXTRA_PACKS:-无}"
          python3 - "$ST" "$COLOR" "$DUR" "$DEV_LABEL" "$CONFIG_FILE" "$EXTRA" "$REL" "$RUN_URL" <<'PYEOF' > payload.json
          import json,sys,html
          st,color,dur,label,cfg,extra,rel,url=sys.argv[1:9]
          rows=[("工作流","Build ImmortalWrt (new)"),("状态",f'<span style="color:{color}">{html.escape(st)}</span>'),
                ("用时",dur),("机型",html.escape(label)),("配置",html.escape(cfg)),
                ("额外软件包",html.escape(extra)),("Release",html.escape(rel)),
                ("运行链接",f'<a href="{html.escape(url)}">查看日志</a>')]
          body="<table border=1 cellpadding=6 cellspacing=0>"+"".join(f"<tr><td>{k}</td><td>{v}</td></tr>" for k,v in rows)+"</table>"
          print(json.dumps({"token":"","title":f"{st} | Build ImmortalWrt (new) | {label}",
                            "content":body,"template":"html"},ensure_ascii=False))
          PYEOF
          python3 - "payload.json" "$PUSHPLUS_TOKEN" <<'PYEOF' > payload2.json
          import json,sys
          d=json.load(open(sys.argv[1])); d["token"]=sys.argv[2]
          print(json.dumps(d,ensure_ascii=False))
          PYEOF
          curl -sS -X POST "https://www.pushplus.plus/send" -H "Content-Type: application/json" \
            --data-binary @payload2.json | head -c 200

      - name: Write Job Summary
        if: always()
        run: |
          {
            echo "## Build ImmortalWrt (new)"
            echo ""
            echo "- 机型：${{ needs.resolve.outputs.devices_label }}"
            echo "- 配置文件：${{ needs.resolve.outputs.config_file }}"
            echo "- 额外软件包：$(if [ -n '${{ github.event.inputs.extra_packages }}' ]; then printf '%s' '${{ github.event.inputs.extra_packages }}' | sed 's/  */、/g'; else echo 无; fi)"
            echo "- 构建结果：${{ needs.build.result }}"
            echo "- Release：${{ steps.release.outputs.tag }}"
            echo "- 构建记录：[#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } >> "$GITHUB_STEP_SUMMARY"
